<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bedrock Chat (Claude Sonnet 4.6 via AWS Lambda) • AWS Individual Sandbox</title>
<style>
  :root {
    --bg-page: #F8FAFC;
    --bg-card: #FFFFFF;
    --border-color: #CBD5E1;
    --text-main: #0F172A;
    --text-muted: #64748B;
    --accent-blue: #0284C7;
    --accent-green: #059669;
    --accent-purple: #7C3AED;
    --accent-rose: #E11D48;
    --aws-orange: #FF9900;
    --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--font-sans); background: var(--bg-page); color: var(--text-main); display: flex; flex-direction: column; }
  a { color: var(--accent-blue); }

  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 18px; background: #0F172A; color: #F8FAFC; }
  header h1 { font-size: 15px; font-weight: 800; }
  header h1 span { color: var(--aws-orange); }
  header nav a { color: #CBD5E1; font-size: 12px; text-decoration: none; }

  .auth-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 18px; font-size: 12px; background: #FFFFFF; border-bottom: 1.5px solid #E2E8F0; }
  .auth-bar.unlocked { background: #ECFDF5; border-bottom-color: #A7F3D0; }
  .pill { font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #FEE2E2; color: #991B1B; }
  .auth-bar.unlocked .pill { background: #D1FAE5; color: #065F46; }
  .auth-bar input { font-size: 12px; padding: 4px 8px; width: 180px; border: 1px solid var(--border-color); border-radius: 6px; }

  .btn { font: inherit; font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent-purple); color: #FFFFFF; }
  .btn-secondary { background: #FFFFFF; color: var(--text-main); border-color: var(--border-color); }

  main { flex: 1; display: flex; flex-direction: column; max-width: 900px; width: 100%; margin: 0 auto; padding: 12px 18px; min-height: 0; }
  #transcript { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 8px 2px 16px; }
  .empty { margin: auto; text-align: center; color: var(--text-muted); font-size: 13px; line-height: 1.6; max-width: 520px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent-purple); color: #FFFFFF; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--bg-card); border: 1px solid #E2E8F0; border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; background: #FFF1F2; border: 1px solid #FECDD3; color: #9F1239; }
  .msg pre { background: #0F172A; color: #E2E8F0; font-family: var(--font-mono); font-size: 12px; padding: 10px; border-radius: 8px; overflow-x: auto; margin: 6px 0; white-space: pre; }
  .msg code { font-family: var(--font-mono); font-size: 12.5px; background: #F1F5F9; padding: 1px 4px; border-radius: 4px; }
  .msg pre code { background: none; padding: 0; }
  .meta { display: block; margin-top: 6px; font-size: 10.5px; color: var(--text-muted); font-family: var(--font-mono); }
  .typing { color: var(--text-muted); font-style: italic; }

  form { display: flex; gap: 8px; align-items: flex-end; padding-top: 10px; border-top: 1px solid #E2E8F0; }
  textarea { flex: 1; resize: none; font: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 10px; min-height: 44px; max-height: 200px; }
  textarea:focus, .auth-bar input:focus { outline: 2px solid #C4B5FD; border-color: var(--accent-purple); }
  .hint { font-size: 11px; color: var(--text-muted); padding-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>💬 Bedrock Chat • <span>Claude Sonnet 4.6</span> via AWS Lambda (us-east-2)</h1>
  <nav><a href="index.html">← Back to Test Bench Hub</a></nav>
</header>

<div class="auth-bar" id="authBar">
  <div style="display:flex; align-items:center; gap:8px;">
    <span style="color:var(--text-muted);">Owner Authentication:</span>
    <span class="pill" id="authPill">🔒 LOCKED: OWNER PASSCODE REQUIRED</span>
  </div>
  <div style="display:flex; align-items:center; gap:6px;" id="authControls">
    <input type="password" id="passcodeInput" placeholder="Enter Owner Passcode..." autocomplete="current-password">
    <button class="btn btn-primary" id="unlockBtn" type="button">Unlock</button>
  </div>
</div>

<main>
  <div id="transcript"></div>
  <form id="chatForm">
    <textarea id="promptInput" rows="1" placeholder="Unlock owner mode to chat..." disabled></textarea>
    <button class="btn btn-primary" id="sendBtn" type="submit" disabled>Send</button>
    <button class="btn btn-secondary" id="clearBtn" type="button">Clear</button>
  </form>
  <div class="hint">Enter to send • Shift+Enter for newline • Each message is a live Bedrock call billed to the owner's AWS account.</div>
</main>

<script>
(() => {
  const LAMBDA_URL = "https://rzif6dkmsvpk7xczl3ekzksepe0uyejl.lambda-url.us-east-2.on.aws/";
  const MODEL_ID = "us.anthropic.claude-sonnet-4-6";
  const PASSCODE_KEY = "cosmos_aws_passcode";
  const HISTORY_KEY = "cosmos_bedrock_chat_history";
  const MAX_HISTORY_TURNS = 12;

  const $ = (id) => document.getElementById(id);
  const transcriptEl = $("transcript");
  const promptEl = $("promptInput");
  const sendBtn = $("sendBtn");

  let passcode = sessionStorage.getItem(PASSCODE_KEY) || "";
  let history = loadHistory();
  let busy = false;

  function loadHistory() {
    try { return JSON.parse(sessionStorage.getItem(HISTORY_KEY)) || []; } catch { return []; }
  }
  function saveHistory() { sessionStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function formatText(text) {
    return escapeHtml(text)
      .replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, code) => `<pre><code>${code.replace(/\n$/, "")}</code></pre>`)
      .replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  }

  function renderMessage(msg) {
    const el = document.createElement("div");
    el.className = `msg ${msg.role}`;
    el.innerHTML = msg.role === "user" ? escapeHtml(msg.content) : formatText(msg.content);
    if (msg.meta) {
      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = msg.meta;
      el.appendChild(meta);
    }
    transcriptEl.appendChild(el);
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
    return el;
  }

  function renderAll() {
    transcriptEl.innerHTML = "";
    if (!history.length) {
      transcriptEl.innerHTML = `<div class="empty">Chat with <strong>Claude Sonnet 4.6</strong> on Amazon Bedrock.<br>
        This page is plain HTML; every message is sent to the project's AWS Lambda Function URL, which calls Bedrock in <code>us-east-2</code>.<br>
        ${passcode ? "Type a message below to start." : "Enter the Owner Passcode above to unlock."}</div>`;
      return;
    }
    history.forEach(renderMessage);
  }

  function syncAuthUi() {
    const unlocked = Boolean(passcode);
    $("authBar").classList.toggle("unlocked", unlocked);
    $("authPill").textContent = unlocked ? "🔓 OWNER LIVE MODE (us-east-2)" : "🔒 LOCKED: OWNER PASSCODE REQUIRED";
    $("authControls").innerHTML = unlocked
      ? `<button class="btn btn-secondary" id="lockBtn" type="button">Lock</button>`
      : `<input type="password" id="passcodeInput" placeholder="Enter Owner Passcode..." autocomplete="current-password">
         <button class="btn btn-primary" id="unlockBtn" type="button">Unlock</button>`;
    if (unlocked) {
      $("lockBtn").onclick = lock;
    } else {
      $("unlockBtn").onclick = unlock;
      $("passcodeInput").onkeydown = (e) => { if (e.key === "Enter") unlock(); };
    }
    promptEl.disabled = !unlocked || busy;
    sendBtn.disabled = !unlocked || busy;
    promptEl.placeholder = unlocked ? "Message Claude Sonnet 4.6..." : "Unlock owner mode to chat...";
    if (!history.length) renderAll();
  }

  async function callLambda(body, key) {
    const resp = await fetch(LAMBDA_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Cosmos-Key": key },
      body: JSON.stringify(body)
    });
    let data = {};
    try { data = await resp.json(); } catch { /* non-JSON body */ }
    return { resp, data };
  }

  async function unlock() {
    const val = ($("passcodeInput")?.value || "").trim();
    if (!val) return;
    $("unlockBtn").disabled = true;
    try {
      const { resp, data } = await callLambda({ action: "status" }, val);
      if (resp.status === 401 || data.locked) {
        alert("Invalid Owner Passcode.");
        $("unlockBtn").disabled = false;
        return;
      }
      passcode = val;
      sessionStorage.setItem(PASSCODE_KEY, passcode);
      syncAuthUi();
      promptEl.focus();
    } catch (e) {
      alert(`Could not reach AWS Lambda: ${e.message}`);
      $("unlockBtn").disabled = false;
    }
  }

  function lock() {
    passcode = "";
    sessionStorage.removeItem(PASSCODE_KEY);
    syncAuthUi();
  }

  function buildPrompt(userText) {
    const prior = history.slice(-MAX_HISTORY_TURNS * 2);
    if (!prior.length) return userText;
    const convo = prior
      .filter((m) => m.role === "user" || m.role === "assistant")
      .map((m) => `${m.role === "user" ? "User" : "Assistant"}: ${m.content}`)
      .join("\n\n");
    return `You are a helpful assistant in a multi-turn chat. Conversation so far:\n\n${convo}\n\nUser: ${userText}\n\nReply to the user's latest message directly.`;
  }

  async function send(e) {
    e.preventDefault();
    const text = promptEl.value.trim();
    if (!text || busy || !passcode) return;

    const prompt = buildPrompt(text);
    if (!history.length) transcriptEl.innerHTML = "";
    const userMsg = { role: "user", content: text };
    history.push(userMsg);
    renderMessage(userMsg);
    promptEl.value = "";
    autoGrow();

    busy = true;
    syncAuthUi();
    const typingEl = renderMessage({ role: "assistant", content: "" });
    typingEl.innerHTML = `<span class="typing">Claude is thinking…</span>`;
    const started = performance.now();

    try {
      const { resp, data } = await callLambda({
        action: "run_cicd_audit",
        stage: "Bedrock Chat",
        model: MODEL_ID,
        prompt
      }, passcode);
      typingEl.remove();

      if (resp.status === 401 || data.locked) {
        history.pop();
        saveHistory();
        renderMessage({ role: "error", content: "Owner passcode rejected (HTTP 401). Please unlock again." });
        lock();
        return;
      }
      const reply = data.bedrock?.text;
      if (!resp.ok || !reply) {
        renderMessage({ role: "error", content: `Lambda error (HTTP ${resp.status}): ${data.error || data.bedrock?.error || "no Bedrock text in response"}` });
        return;
      }
      const latency = data.bedrock?.latency_ms ?? Math.round(performance.now() - started);
      const reqId = data.lambda_request_id || resp.headers.get("x-amzn-RequestId") || "";
      const assistantMsg = { role: "assistant", content: reply, meta: `${MODEL_ID} • ${latency}ms${reqId ? ` • req ${reqId.slice(0, 8)}` : ""}` };
      history.push(assistantMsg);
      saveHistory();
      renderMessage(assistantMsg);
    } catch (err) {
      typingEl.remove();
      renderMessage({ role: "error", content: `Network error calling AWS Lambda: ${err.message}` });
    } finally {
      busy = false;
      syncAuthUi();
      promptEl.focus();
    }
  }

  function autoGrow() {
    promptEl.style.height = "auto";
    promptEl.style.height = Math.min(promptEl.scrollHeight, 200) + "px";
  }

  $("chatForm").addEventListener("submit", send);
  promptEl.addEventListener("input", autoGrow);
  promptEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("chatForm").requestSubmit(); }
  });
  $("clearBtn").addEventListener("click", () => {
    history = [];
    saveHistory();
    renderAll();
  });

  syncAuthUi();
  renderAll();
})();
</script>
</body>
</html>
